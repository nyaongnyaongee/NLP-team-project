services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eum
      POSTGRES_PASSWORD: eum
      POSTGRES_DB: eum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  pgdata:
