<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이음 시험 화면</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1f24; --mute:#6b7280; --line:#e2e5ea;
          --me:#dbeafe; --other:#f1f3f5; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2025; --text:#e8eaed; --mute:#9aa0a6; --line:#2e3238;
            --me:#1e3a5f; --other:#2a2e34; --accent:#60a5fa; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--mute); margin:0 0 16px; font-size:13px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:14px; display:flex; flex-direction:column; min-height:520px; }
  .panel h2 { font-size:15px; margin:0 0 10px; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  input, select, button { font:inherit; padding:8px 10px; border-radius:8px;
         border:1px solid var(--line); background:var(--bg); color:var(--text); }
  input, textarea { flex:1; min-width:0; }
  textarea { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
             background:var(--bg); color:var(--text); resize:vertical; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  .who { font-size:13px; color:var(--mute); margin-bottom:8px; }
  .live { font-size:11px; margin-left:6px; }
  .live.on { color:#16a34a; } .live.off { color:#b45309; }
  .msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
          padding:8px 0; max-height:380px; }
  .m { white-space:pre-wrap; max-width:80%; padding:8px 12px; border-radius:12px; background:var(--other); }
  .m.me { align-self:flex-end; background:var(--me); }
  .meta { font-size:11px; color:var(--mute); margin-top:2px; }
  .empty { color:var(--mute); text-align:center; margin-top:40px; }
  .err { color:#dc2626; font-size:13px; min-height:18px; }
  .pending { color:var(--mute); font-style:italic; }
  .switch { display:flex; align-items:center; gap:10px; margin:0 0 16px; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:10px; font-size:14px; }
  .switch label { display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; }
  .switch input { width:18px; height:18px; flex:none; }
  .switch .note { color:var(--mute); font-weight:400; font-size:13px; }
  .switch.on { border-color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .chip { font-size:11px; padding:1px 7px; border-radius:99px; background:var(--card); border:1px solid var(--line); color:var(--mute); }
  .chip.warn { color:#b45309; border-color:#b45309; }
  .note { margin-top:4px; font-size:12px; color:#dc2626; }
  .tools { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; font-size:13px; }
  .tools summary { cursor:pointer; color:var(--mute); }
  .tools .row { margin-top:6px; }
  .checks { margin:4px 0 0; padding-left:18px; color:#b45309; font-size:12px; }
  .out { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:6px; }
  button:disabled { opacity:.5; cursor:default; }
  .tasks { margin-top:6px; display:flex; flex-direction:column; gap:4px; }
  .task { display:flex; align-items:center; gap:6px; padding:4px 8px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  .task.candidate { border-style:dashed; }
  .task.done .t { text-decoration:line-through; color:var(--mute); }
  .task .t { flex:1; min-width:0; }
  .task .k { font-size:11px; color:var(--mute); flex:none; }
  .task .d { font-size:11px; color:var(--accent); }
  .task button { padding:1px 7px; font-size:12px; flex:none; }
  .task button.x { background:transparent; color:var(--mute); }
  .xstate { font-size:12px; color:var(--mute); align-self:center; }
  .closed { font-size:11px; margin-left:6px; color:#b45309; }
  .nlist { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .nitem { border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:13px; }
  .nitem.draft { border-style:dashed; }
  .nitem summary { cursor:pointer; color:var(--text); }
  .nitem .b { white-space:pre-wrap; margin-top:4px; }
  .nitem .row { margin:4px 0 0; }
  .nitem button { padding:1px 7px; font-size:12px; }
  .nitem button.x { background:transparent; color:var(--mute); border:1px solid var(--line); }
  .pnotices { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; font-size:13px; }
  .pnotices summary { cursor:pointer; color:var(--mute); }
  .panel.team { grid-column:1 / -1; min-height:0; }
  .rlist { display:flex; flex-direction:column; gap:6px; }
  .ritem { border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; }
  .ritem summary { cursor:pointer; }
  .sev { font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); margin-left:4px; }
  .sev.높음 { color:#dc2626; border-color:#dc2626; } .sev.보통 { color:#b45309; border-color:#b45309; }
  .rbody { margin-top:6px; }
  .rbody h4 { font-size:12px; color:var(--mute); margin:8px 0 2px; font-weight:600; }
  .rbody ul { margin:0; padding-left:18px; }
  .quote { background:var(--bg); border-left:3px solid #dc2626; padding:2px 8px; margin:2px 0; white-space:pre-wrap; }
  .rmsg { font-size:12px; white-space:pre-wrap; padding:2px 0; border-bottom:1px dashed var(--line); }
  .rmsg.hit { background:rgba(220,38,38,.08); }
  .rsum { white-space:pre-wrap; font-size:13px; margin-top:4px; }
  .link { margin-top:6px; padding:2px 8px; font-size:12px; background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<h1>이음 시험 화면</h1>
<p class="sub">왼쪽(학부모)에서 보내면 오른쪽(교사)에 바로 나타납니다(WebSocket). 비밀번호는 모두 test1234.
  <button id="bell" class="link">🔔 알림 켜기</button></p>
<div class="switch" id="sw" hidden>
  <label><input type="checkbox" id="swBox"> Claude 켜기 (정제 · 초안 API 호출)</label>
  <span class="note" id="swNote"></span>
  <button id="reset" class="link" style="margin:0 0 0 auto; flex:none">대화 내용 모두 지우기</button>
</div>
<div class="grid" id="grid"></div>

<script>
const API = "http://localhost:8000";

function panel(title, defaultLogin) {
  const el = document.createElement("div");
  el.className = "panel";
  el.innerHTML = `
    <h2>${title}</h2>
    <div class="row">
      <select class="login">
        <option value="parent1">parent1 (박서연)</option>
        <option value="parent2">parent2 (이도윤)</option>
        <option value="teacher1">teacher1 (김민지 교사)</option>
        <option value="team1">team1 (정하은 민원대응팀)</option>
      </select>
      <button class="go">로그인</button>
    </div>
    <div class="err"></div>
    <div class="who"></div>
    <div class="row"><select class="conv" hidden></select></div>
    <div class="msgs"><div class="empty">로그인하면 대화가 보입니다</div></div>
    <div class="row">
      <textarea class="text" rows="2" placeholder="메시지 입력 후 Enter (줄바꿈은 Shift+Enter)" disabled></textarea>
      <button class="send" disabled>보내기</button>
    </div>
    <div class="tools" hidden>
      <details class="snotes" hidden>
        <summary>학생 메모</summary>
        <div class="row"><textarea class="pad" rows="6" placeholder="담임만 보는 메모장 — 적으면 저절로 저장됩니다 (학부모 · Claude 에게 안 감)&#10;예: 큰 소리에 놀람 — 활동 전에 미리 알려 주면 괜찮음"></textarea></div>
        <div class="xstate padstate"></div>
      </details>
      <div class="row">
        <input class="memo" placeholder="답장에 담을 내용 (예: 보건실 다녀옴, 체육 선생님께 전달함) — 비워도 됨">
        <button class="draft">메모로 초안 쓰기</button>
      </div>
      <ul class="checks reply-checks"></ul>
      <div class="row"><button class="close">대화 닫기 · 할 일 뽑기</button><span class="xstate"></span></div>
      <div class="tasks"></div>
      <details class="rbox">
        <summary>민원대응팀에 신고</summary>
        <div class="row"><input class="rmemo" placeholder="신고 사유 (예: 밤마다 욕설 · 협박이 이어짐) — 비워도 됨">
          <button class="report">신고 · 보고서 만들기</button></div>
        <div class="xstate rstate"></div>
        <div class="rsum"></div>
      </details>
      <details>
        <summary>공지 쓰기 · 보내기</summary>
        <div class="row"><textarea class="points" rows="3" placeholder="공지 요점 (예: 11/14 현장학습, 9시 운동장, 도시락 · 물)"></textarea></div>
        <div class="row"><button class="notice">공지 초안</button></div>
        <ul class="checks notice-checks"></ul>
        <div class="row"><input class="ntitle" placeholder="공지 제목 (초안을 쓰거나 직접 입력)"></div>
        <div class="row"><textarea class="nbody" rows="6" placeholder="공지 본문"></textarea></div>
        <div class="row"><button class="nsave">저장</button><button class="nsend">보내기</button>
          <button class="nnew link" style="margin:0">새로 쓰기</button><span class="xstate nstate"></span></div>
        <div class="nlist tnotices"></div>
      </details>
    </div>
    <div class="rlist" hidden><div class="empty">신고된 대화가 없습니다</div></div>
    <details class="pnotices" open hidden>
      <summary>받은 공지</summary>
      <div class="nlist pnlist"></div>
    </details>`;
  const q = s => el.querySelector(s);
  q(".login").value = defaultLogin;
  let token = null, me = null, convId = null, timer = null;
  let sock = null, live = false, gen = 0;   // gen: 다시 로그인하면 옛 연결의 재접속을 멈춘다
  let seen = null;                          // 메시지 id → 상태 (띵 판단용, 처음 읽을 때는 null)
  let busy = false, again = false;          // 새로 읽기가 겹치지 않게
  let noticeId = null;                      // 교사가 고치고 있는 공지 (null = 새 공지)
  let seenNotices = null;                   // 학부모: 이미 본 공지 id (띵 판단용)
  let notesFor = undefined;                 // 학생 메모를 보여 주고 있는 학생 id (바뀔 때만 다시 읽음)
  let seenReports = null;                   // 민원대응팀: 신고 id → 상태 (띵 판단용)

  async function api(path, opt = {}) {
    const r = await fetch(API + path, { ...opt, headers: {
      "content-type": "application/json",
      ...(token ? { Authorization: "Bearer " + token } : {}) } });
    if (r.status === 204) return null;
    if (!r.ok) {
      const d = (await r.json().catch(() => ({}))).detail;
      // 422 는 detail 이 목록이라 그대로 쓰면 [object Object] 가 된다
      const msg = Array.isArray(d) ? d.map(x => x.msg).join(" / ") : d;
      throw new Error(msg || "HTTP " + r.status);
    }
    return r.json();
  }

  const STATUS_KO = { pending: "정제 중", failed: "정제 실패", skip: "" };

  function teacherMessageText(m) {
    if (m.status !== "done") return null;
    return m.refined_text ?? m.raw_text ?? null;
  }

  // 정제됐는지 원문 그대로인지는 교사에게 드러내지 않는다
  function statusLabel(m) {
    return m.status === "done" ? "" : (STATUS_KO[m.status] || "");
  }

  function mk(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderMsg(m) {
    const d = mk("div", "m" + (m.sender_id === me.id ? " me" : ""));
    // 교사 화면: 완료된 학부모 글은 정제문이 있으면 정제문, 통과한 글이면 원문. 어느 쪽인지는 표시하지 않는다
    const refinedView = me.role === "teacher" && m.status !== "skip";
    if (!refinedView) {
      d.appendChild(mk("div", "", m.raw_text));
    } else if (m.status === "pending") {
      d.appendChild(mk("div", "pending", "정제 중…"));
    } else if (m.status === "done") {
      d.appendChild(mk("div", "", teacherMessageText(m) ?? "표시할 메시지가 없습니다"));
      const a = m.analysis || {};
      const chips = mk("div", "chips");
      if (a.abusive) chips.appendChild(mk("span", "chip warn", "욕설·인신공격 있음"));
      if (a.topic) chips.appendChild(mk("span", "chip", a.topic));
      for (const r of a.requests || []) chips.appendChild(mk("span", "chip", "요청: " + r.type));
      for (const t of a.threats || []) chips.appendChild(mk("span", "chip warn", "위협: " + t));
      if (a.deadline) chips.appendChild(mk("span", "chip warn", "시한: " + a.deadline));
      d.appendChild(chips);
    } else {  // failed: 원문은 교사에게 안 보여 준다. 다시 정제만 할 수 있다
      d.appendChild(mk("div", "note", "정제하지 못했습니다: " + ((m.analysis || {}).error || "알 수 없음")));
      const btn = mk("button", "link", "다시 정제");
      btn.onclick = async () => {
        try { await api(`/conversations/${convId}/messages/${m.id}/refine`, { method: "POST" }); } catch (e) { q(".err").textContent = e.message; }
        refresh();
      };
      d.appendChild(btn);
    }
    const label = statusLabel(m);
    d.appendChild(mk("div", "meta", `${label ? label + " · " : ""}${new Date(m.created_at).toLocaleTimeString("ko-KR")}`));
    return d;
  }

  // 띵: 교사 = 학부모 글이 처리되어 읽을 수 있게 됐을 때, 학부모 = 교사 글이 새로 왔을 때
  function checkDing(list) {
    if (seen !== null) {
      for (const m of list) {
        if (m.sender_id === me.id) continue;
        const prev = seen.get(m.id);
        const text = teacherMessageText(m);
        if (me.role === "teacher" && m.status === "done" && prev !== "done" && text != null)
          ding(`${me.name} 선생님 · 새 메시지`, text);
        if (me.role !== "teacher" && m.status === "skip" && prev === undefined) ding(`${me.name} · 선생님 답장`, m.raw_text);
      }
    }
    seen = new Map(list.map(m => [m.id, m.status]));
  }

  function setLive(on) {
    live = on;
    const b = q(".live");
    if (b) { b.textContent = on ? "● 실시간 연결" : "● 연결 끊김 (2초마다 확인)"; b.className = "live " + (on ? "on" : "off"); }
  }

  function connect(myGen) {
    if (myGen !== gen) return;
    const ws = new WebSocket(API.replace(/^http/, "ws") + "/ws");
    sock = ws;
    ws.onopen = () => ws.send(JSON.stringify({ token }));  // 토큰은 주소가 아니라 첫 메시지로
    ws.onmessage = e => {
      const d = JSON.parse(e.data);
      if (d.type === "ready") { setLive(true); refresh(); }
      if (d.type === "changed" && d.conversation_id === convId) refresh();
      if (d.type === "notice") loadNotices();
      if (d.type === "report" && me.role === "complaint_team") loadReports();
    };
    ws.onclose = () => {
      if (sock === ws) setLive(false);
      setTimeout(() => connect(myGen), 3000);  // 서버를 다시 켜면 알아서 다시 붙는다
    };
  }

  async function refresh() {
    if (!convId) return;
    if (busy) { again = true; return; }
    busy = true;
    try {
      const list = await api(`/conversations/${convId}/messages`);
      const conv = await api(`/conversations/${convId}`);
      showConv(conv);
      if (me.role === "teacher") await renderTasks(conv);
      checkDing(list);
      const box = q(".msgs");
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.innerHTML = list.length ? "" : '<div class="empty">아직 메시지가 없습니다</div>';
      for (const m of list) box.appendChild(renderMsg(m));
      if (atBottom) box.scrollTop = box.scrollHeight;
    } catch (e) { q(".err").textContent = e.message; }
    busy = false;
    if (again) { again = false; refresh(); }
  }

  q(".go").onclick = async () => {
    q(".err").textContent = "";
    try {
      const res = await api("/auth/login", { method: "POST", body: JSON.stringify(
        { login_id: q(".login").value, password: "test1234" }) });
      token = res.token;
      me = { name: res.name, role: res.role };
      const team = res.role === "complaint_team";
      for (const s of [".msgs", ".text", ".send", ".conv"]) q(s).closest(".row, .msgs").hidden = team;
      q(".rlist").hidden = !team;
      if (team) {  // 민원대응팀: 대화가 없고 신고 목록만 본다
        q(".who").textContent = `${res.name} (민원대응팀)`; q(".who").appendChild(mk("span", "live"));
        q(".tools").hidden = true; q(".pnotices").hidden = true;
        clearInterval(timer); seenReports = null; gen += 1; if (sock) sock.close(); setLive(false); connect(gen);
        loadReports();
        timer = setInterval(() => { if (!live) loadReports(); }, 5000);
        return;
      }
      const convs = await api("/conversations");
      convId = convs[0].id;
      // 내 id 는 첫 대화의 teacher_id/parent_id 로 알아냄
      me.id = res.role === "teacher" ? convs[0].teacher_id : convs[0].parent_id;
      const sel = q(".conv");
      sel.innerHTML = "";
      for (const c of convs) sel.appendChild(new Option(`대화 #${c.id} · 학생 ${c.student_name}`, c.id));
      sel.hidden = convs.length < 2;
      sel.onchange = () => {
        convId = +sel.value; seen = null; q(".reply-checks").innerHTML = "";
        q(".text").value = ""; q(".memo").value = ""; q(".rmemo").value = "";  // 쓰던 글이 다른 학부모에게 가지 않게
        refresh();
      };
      q(".who").textContent = `${res.name} (${res.role})`;
      q(".who").appendChild(mk("span", "closed"));
      q(".who").appendChild(mk("span", "live"));
      q(".text").disabled = q(".send").disabled = false;
      q(".tools").hidden = res.role !== "teacher";
      q(".pnotices").hidden = res.role === "teacher";
      seenNotices = null; noticeId = null; notesFor = undefined;
      loadNotices();
      clearInterval(timer);
      seen = null;
      gen += 1;
      if (sock) sock.close();
      setLive(false);
      connect(gen);
      refresh();
      // 실시간 연결이 있으면 알림이 올 때만 읽고(30초마다 한 번은 확인), 끊겼으면 예전처럼 2초마다 읽는다
      let ticks = 0;
      timer = setInterval(() => {
        ticks += 1;
        if (!live || ticks % 15 === 0) refresh();
        if (!live && ticks % 5 === 0) loadNotices();  // 끊겼을 때 공지는 10초마다
      }, 2000);
    } catch (e) { q(".err").textContent = e.message; }
  };

  async function send() {
    const t = q(".text").value.trim();
    if (!t) return;
    q(".text").value = "";
    q(".reply-checks").innerHTML = "";
    try {
      await api(`/conversations/${convId}/messages`, { method: "POST", body: JSON.stringify({ text: t }) });
      refresh();
    } catch (e) { q(".err").textContent = e.message; }
  }
  q(".send").onclick = send;
  q(".text").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });

  // 대화 닫기 → 서버가 할 일 · 일정 후보를 뽑는다 (닫힌 대화에 누가 글을 보내면 다시 열림)
  function showConv(conv) {
    const closed = conv.status === "closed";
    q(".closed").textContent = closed ? "· 닫힌 대화 (글을 보내면 다시 열림)" : "";
    if (me.role !== "teacher") return;
    const x = conv.extract || {}, b = q(".close"), st = q(".xstate");
    b.disabled = closed && x.status === "pending";
    b.textContent = closed ? "다시 뽑기" : "대화 닫기 · 할 일 뽑기";
    b.onclick = async () => {
      b.disabled = true; q(".err").textContent = "";
      try { await api(`/conversations/${convId}/${closed ? "extract" : "close"}`, { method: "POST" }); } catch (e) { q(".err").textContent = e.message; }
      refresh();
    };
    st.textContent = !closed ? "" : x.status === "pending" ? "할 일 · 일정 뽑는 중…"
      : x.status === "failed" ? "뽑지 못했습니다: " + x.error : x.status === "done" ? `후보 ${x.count}개` : "";
    st.style.color = x.status === "failed" ? "#dc2626" : "";
    showReport(conv);
    if (conv.student_id !== notesFor) { savePad(); notesFor = conv.student_id; loadStudentNotes(); }
  }

  // 학생 메모장: 학생마다 하나, 적는 대로 저장 (멈추고 0.8초 뒤 · 칸을 벗어날 때 · 대화를 바꿀 때)
  let padTimer = null, padDirty = false;
  async function savePad() {
    clearTimeout(padTimer);
    if (!padDirty || !notesFor) return;
    const sid = notesFor, body = q(".pad").value;
    padDirty = false;
    q(".padstate").textContent = "저장 중…";
    try {
      await api(`/students/${sid}/memo`, { method: "PUT", body: JSON.stringify({ body }) });
      if (sid === notesFor && !padDirty) q(".padstate").textContent = "저장됨";
    } catch (e) { padDirty = true; q(".padstate").textContent = "저장 못 함: " + e.message; }
  }
  q(".pad").addEventListener("input", () => {
    padDirty = true; q(".padstate").textContent = "";
    clearTimeout(padTimer); padTimer = setTimeout(savePad, 800);
  });
  q(".pad").addEventListener("blur", savePad);
  async function loadStudentNotes() {
    const box = q(".snotes"), sid = notesFor;
    box.hidden = !sid;
    q(".pad").value = ""; q(".padstate").textContent = "";
    if (!sid) return;
    try {
      const [memo, students] = await Promise.all([api(`/students/${sid}/memo`), api("/students")]);
      if (sid !== notesFor) return;  // 그사이 대화를 바꿨으면 버림
      const st = students.find(x => x.id === sid);
      q(".snotes summary").textContent = `학생 메모 · ${st ? st.name : ""}`;
      q(".pad").value = memo.body;
    } catch (e) { q(".err").textContent = e.message; }
  }

  // 신고(D): 담임에게는 요약 · 심각도만 (원문 인용은 서버가 뺌). 민원대응팀은 아래 loadReports 에서 전부
  function showReport(conv) {
    const r = conv.report, b = q(".report"), st = q(".rstate"), sum = q(".rsum");
    b.disabled = r && r.status === "pending";
    b.textContent = r ? "보고서 다시 만들기" : "신고 · 보고서 만들기";
    b.onclick = async () => {
      if (!r && !confirm("이 대화를 민원대응팀에 신고합니다. 민원대응팀은 학부모 원문까지 봅니다. 신고할까요?")) return;
      b.disabled = true; q(".err").textContent = "";
      try { await api(`/conversations/${convId}/report`, { method: "POST", body: JSON.stringify({ memo: q(".rmemo").value.trim() || null }) }); }
      catch (e) { q(".err").textContent = e.message; }
      refresh();
    };
    st.style.color = r && r.status === "failed" ? "#dc2626" : "";
    st.textContent = !r ? "" : `신고함 ${when(conv.reported_at)} · ` + (r.status === "pending" ? "보고서 쓰는 중…"
      : r.status === "failed" ? "보고서를 쓰지 못했습니다: " + r.error : `심각도 ${r.severity || "?"} · 문제 메시지 ${(r.incidents || []).length}개`);
    sum.textContent = r && r.status === "done" ? r.summary : "";
    if (r) q(".rbox").open = true;
  }

  function listBlock(box, title, items) {
    if (!items || !items.length) return;
    box.appendChild(mk("h4", "", title));
    const ul = mk("ul");
    for (const it of items) ul.appendChild(mk("li", "", it));
    box.appendChild(ul);
  }
  async function reportDetail(id, box) {
    const d = await api(`/reports/${id}`), r = d.report;
    box.innerHTML = "";
    if (r.status !== "done") { box.appendChild(mk("div", "note", r.status === "pending" ? "보고서 쓰는 중…" : "보고서를 쓰지 못했습니다: " + r.error)); }
    else {
      box.appendChild(mk("div", "rsum", r.summary));
      if (r.severity_reason) box.appendChild(mk("div", "meta", `심각도 ${r.severity} — ${r.severity_reason}`));
      if (r.memo) listBlock(box, "담임 메모", [r.memo]);
      if (r.incidents.length) {
        box.appendChild(mk("h4", "", "문제 메시지 (원문 인용)"));
        for (const i of r.incidents) {
          box.appendChild(mk("div", "meta", `${when(i.at)} · ${i.types.join(", ")}`));
          box.appendChild(mk("div", "quote", i.quote));
        }
      }
      listBlock(box, "위협", r.threats);
      listBlock(box, "학부모 요구", r.parent_requests);
      listBlock(box, "담임 응대", r.teacher_responses);
      listBlock(box, "확인할 것", r.check);
    }
    const hits = new Set((r.incidents || []).map(i => i.message_id));
    const all = mk("details"); all.appendChild(mk("summary", "", `대화 전체 · 원문 (${d.messages.length})`));
    for (const m of d.messages)
      all.appendChild(mk("div", "rmsg" + (hits.has(m.id) ? " hit" : ""), `${when(m.created_at)} ${m.who === "parent" ? d.parent_name + "(학부모)" : d.teacher_name + "(교사)"}: ${m.raw_text}`));
    box.appendChild(all);
  }
  async function loadReports() {
    if (!token) return;
    try {
      const list = await api("/reports");
      const box = q(".rlist");
      const open = new Set([...box.querySelectorAll("details.ritem[open]")].map(e => +e.dataset.id));
      box.innerHTML = list.length ? "" : '<div class="empty">신고된 대화가 없습니다</div>';
      for (const x of list) {
        const d = mk("details", "ritem"); d.dataset.id = x.conversation_id;
        const s = mk("summary", "", `대화 #${x.conversation_id} · ${x.teacher_name} 교사 ← ${x.parent_name} (학생 ${x.student_name}) · ${when(x.reported_at)}`);
        if (x.status === "done") s.appendChild(mk("span", "sev " + (x.severity || ""), "심각도 " + (x.severity || "?")));
        else s.appendChild(mk("span", "sev", x.status === "pending" ? "쓰는 중" : "실패"));
        d.appendChild(s);
        const body = mk("div", "rbody"); d.appendChild(body);
        d.ontoggle = () => { if (d.open) reportDetail(x.conversation_id, body).catch(e => { q(".err").textContent = e.message; }); };
        box.appendChild(d);
        if (open.has(x.conversation_id)) d.open = true;
        const prev = seenReports && seenReports.get(x.conversation_id);
        if (seenReports !== null && prev !== x.status && x.status === "done") ding(`${me.name} · 신고 보고서`, x.summary);
      }
      seenReports = new Map(list.map(x => [x.conversation_id, x.status]));
    } catch (e) { q(".err").textContent = e.message; }
  }

  const KIND_KO = { todo: "할 일", event: "일정" };
  function due(t) {
    if (!t.due_at) return t.due_text ? `${t.due_text} (날짜 미정)` : "";
    const d = new Date(t.due_at);
    const hm = d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Seoul" });
    const day = d.toLocaleDateString("ko-KR", { month: "numeric", day: "numeric", weekday: "short", timeZone: "Asia/Seoul" });
    const midnight = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Seoul" }) === "00:00";
    return day + (midnight ? "" : " " + hm) + (t.due_text ? ` · 「${t.due_text}」` : "");
  }
  async function renderTasks(conv) {
    const box = q(".tasks");
    const [todos, events] = await Promise.all([
      api(`/todos?conversation_id=${conv.id}`), api(`/events?conversation_id=${conv.id}`)]);
    box.innerHTML = "";
    for (const t of [...events, ...todos]) {
      const row = mk("div", "task " + t.status);
      row.appendChild(mk("span", "k", KIND_KO[t.kind] + (t.status === "candidate" ? " 후보" : "")));
      const body = mk("span", "t", t.title);
      const dd = due(t);
      if (dd) { body.appendChild(document.createElement("br")); body.appendChild(mk("span", "d", dd)); }
      row.appendChild(body);
      const path = `/${t.kind === "todo" ? "todos" : "events"}/${t.id}`;
      const act = async (opt) => { try { await api(path, opt); } catch (e) { q(".err").textContent = e.message; } refresh(); };
      if (t.status === "candidate") { const b = mk("button", "", "추가"); b.onclick = () => act({ method: "PATCH", body: JSON.stringify({ status: "added" }) }); row.appendChild(b); }
      if (t.status === "added") { const b = mk("button", "", "완료"); b.onclick = () => act({ method: "PATCH", body: JSON.stringify({ status: "done" }) }); row.appendChild(b); }
      const x = mk("button", "x", "×"); x.title = "지우기";
      x.onclick = async () => { try { await fetch(API + path, { method: "DELETE", headers: { Authorization: "Bearer " + token } }); } catch (e) {} refresh(); };
      row.appendChild(x);
      box.appendChild(row);
    }
  }

  function showChecks(ul, items) {
    ul.innerHTML = "";
    for (const c of items) ul.appendChild(mk("li", "", "확인: " + c));
  }

  // 답장 초안 → 입력칸에 넣는다. 교사가 고쳐서 「보내기」
  q(".draft").onclick = async () => {
    const b = q(".draft");
    b.disabled = true; b.textContent = "만드는 중…"; q(".err").textContent = "";
    try {
      const forConv = convId;
      const d = await api(`/conversations/${forConv}/draft`, { method: "POST", body: JSON.stringify({ memo: q(".memo").value.trim() || null }) });
      if (convId !== forConv) return;  // 만드는 동안 대화를 바꿨으면 버림 (finally 가 버튼을 되돌림)
      q(".text").value = d.draft;
      showChecks(q(".reply-checks"), d.check);
    } catch (e) { q(".err").textContent = e.message; }
    finally { b.disabled = false; b.textContent = "메모로 초안 쓰기"; }
  };

  // 공지: 초안(Claude) → 제목 · 본문을 고쳐서 [저장](쓰는 중) → [보내기]. 보낸 공지는 고칠 수 없다
  const nstate = t => { q(".nstate").textContent = t; };
  function editNotice(n) {
    noticeId = n ? n.id : null;
    q(".ntitle").value = n ? n.title : "";
    q(".nbody").value = n ? n.body : "";
    q(".notice-checks").innerHTML = "";
    nstate(n ? `#${n.id} 고치는 중` : "");
  }
  q(".nnew").onclick = () => { editNotice(null); q(".points").value = ""; };

  q(".notice").onclick = async () => {
    const b = q(".notice");
    const points = q(".points").value.trim();
    if (!points) { q(".err").textContent = "공지 요점을 먼저 적어 주세요"; return; }
    b.disabled = true; b.textContent = "만드는 중…"; q(".err").textContent = "";
    try {
      const d = await api("/drafts/notice", { method: "POST", body: JSON.stringify({ points }) });
      q(".ntitle").value = d.title;
      q(".nbody").value = d.body;
      showChecks(q(".notice-checks"), d.check);
    } catch (e) { q(".err").textContent = e.message; }
    b.disabled = false; b.textContent = "공지 초안";
  };

  async function saveNotice() {
    const title = q(".ntitle").value.trim(), body = q(".nbody").value.trim();
    if (!title || !body) throw new Error("공지 제목과 본문을 모두 적어 주세요");
    const n = noticeId
      ? await api(`/notices/${noticeId}`, { method: "PATCH", body: JSON.stringify({ title, body }) })
      : await api("/notices", { method: "POST", body: JSON.stringify({ title, body }) });
    noticeId = n.id;
    return n;
  }
  q(".nsave").onclick = async () => {
    q(".err").textContent = "";
    try { const n = await saveNotice(); nstate(`#${n.id} 저장함 (학부모에게는 아직 안 보임)`); } catch (e) { q(".err").textContent = e.message; }
    loadNotices();
  };
  q(".nsend").onclick = async () => {
    q(".err").textContent = "";
    if (!confirm("대화가 있는 학부모 모두에게 보냅니다. 보낸 뒤에는 고치거나 지울 수 없습니다. 보낼까요?")) return;
    const b = q(".nsend"); b.disabled = true;
    try {
      const n = await saveNotice();
      await api(`/notices/${n.id}/send`, { method: "POST" });
      editNotice(null); q(".points").value = "";
      nstate(`#${n.id} 보냈습니다`);
    } catch (e) { q(".err").textContent = e.message; }
    b.disabled = false;
    loadNotices();
  };

  const when = t => new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" });
  function noticeItem(n) {
    const d = mk("details", "nitem " + n.status);
    const label = n.status === "draft" ? `[쓰는 중] ${n.title}` : `${n.title} · ${when(n.sent_at)}`;
    d.appendChild(mk("summary", "", label));
    d.appendChild(mk("div", "b", n.body));
    if (me.role === "teacher" && n.status === "draft") {
      const row = mk("div", "row");
      const e = mk("button", "", "고치기"); e.onclick = () => editNotice(n);
      const x = mk("button", "x", "지우기");
      x.onclick = async () => {
        try { await api(`/notices/${n.id}`, { method: "DELETE" }); if (noticeId === n.id) editNotice(null); } catch (err) { q(".err").textContent = err.message; }
        loadNotices();
      };
      row.appendChild(e); row.appendChild(x); d.appendChild(row);
    }
    return d;
  }
  async function loadNotices() {
    if (!token) return;
    try {
      const list = await api("/notices");
      const box = q(me.role === "teacher" ? ".tnotices" : ".pnlist");
      box.innerHTML = list.length ? "" : '<div class="empty" style="margin:4px 0">공지가 없습니다</div>';
      for (const n of list) box.appendChild(noticeItem(n));
      if (me.role !== "teacher") {
        q(".pnotices summary").textContent = `받은 공지 (${list.length})`;
        if (seenNotices !== null) for (const n of list) if (!seenNotices.has(n.id)) ding(`${me.name} · 새 공지`, n.title);
        seenNotices = new Set(list.map(n => n.id));
      }
    } catch (e) { q(".err").textContent = e.message; }
  }
  return el;
}

// 정제 켜기/끄기 스위치 (dev.py 로 켰을 때만 서버가 응답한다)
const swBox = document.getElementById("swBox"), swNote = document.getElementById("swNote"), sw = document.getElementById("sw");
function showSwitch(on) {
  swBox.checked = on;
  sw.classList.toggle("on", on);
  swNote.textContent = on ? "켜짐 — 학부모 메시지마다, 초안 버튼을 누를 때마다 Claude 를 부릅니다 (건당 약 $0.006)" : "꺼짐 — API 를 안 부릅니다. 보낸 메시지는 「정제하지 못했습니다」로 남고(켠 뒤 「다시 정제」), 초안 버튼은 오류가 납니다";
}
fetch(API + "/dev/refine").then(r => r.ok ? r.json() : null).then(d => { if (d) { sw.hidden = false; showSwitch(d.enabled); } }).catch(() => {});
// 시험용 초기화: 메시지 · 할 일 · 일정을 모두 지우고 대화를 다시 연다 (계정 · 대화 · 스위치는 그대로)
document.getElementById("reset").onclick = async () => {
  if (!confirm("모든 대화의 메시지와 할 일 · 일정 · 공지를 지웁니다. 계속할까요?")) return;
  try {
    const r = await fetch(API + "/dev/reset", { method: "POST" });
    if (!r.ok) throw new Error(r.status);
  } catch (e) { swNote.textContent = "초기화 오류: " + e.message; }
};
swBox.onchange = async () => {
  try {
    const r = await fetch(API + "/dev/refine", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ enabled: swBox.checked }) });
    showSwitch((await r.json()).enabled);
  } catch (e) { swNote.textContent = "스위치 오류: " + e.message; swBox.checked = !swBox.checked; }
};

// 🔔 알림: 브라우저는 사용자가 한 번 누르기 전에는 소리를 막는다 → 버튼으로 켠다. 알림 창은 권한을 물어본다
let audio = null;
const bell = document.getElementById("bell");
// 소리는 화면을 아무 데나 한 번 누르거나 타자를 치면 켜진다 (알림 창 허용은 한 번 하면 브라우저가 기억함)
function wakeAudio() {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  if (bell.textContent === "🔔 알림 켜기") bell.textContent = "🔔 소리 켜짐 — 알림 창도 쓰려면 누르세요";
  if ("Notification" in window && Notification.permission === "granted") bell.textContent = "🔔 알림 켜짐 (소리 + 알림 창)";
}
document.addEventListener("pointerdown", wakeAudio, { once: true, capture: true });
document.addEventListener("keydown", wakeAudio, { once: true, capture: true });
bell.onclick = async () => {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  await audio.resume();
  if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission();
  const pop = "Notification" in window && Notification.permission === "granted";
  bell.textContent = pop ? "🔔 알림 켜짐 (소리 + 알림 창)" : "🔔 알림 켜짐 (소리만 — 알림 창은 브라우저 설정에서 허용)";
  beep();
};
function beep() {
  if (!audio) return;
  const t = audio.currentTime;
  for (const [f, at] of [[880, 0], [1320, 0.12]]) {  // 띵-동
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f; o.type = "sine";
    g.gain.setValueAtTime(0.0001, t + at);
    g.gain.exponentialRampToValueAtTime(0.3, t + at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + at + 0.35);
    o.connect(g).connect(audio.destination);
    o.start(t + at); o.stop(t + at + 0.4);
  }
}
function ding(title, body) {
  beep();
  if ("Notification" in window && Notification.permission === "granted" && audio)
    new Notification(title, { body: (body || "").slice(0, 80) });
}

const grid = document.getElementById("grid");
const teamPanel = panel("민원대응팀 화면", "team1"); teamPanel.classList.add("team");
grid.append(panel("학부모 화면", "parent1"), panel("교사 화면", "teacher1"), teamPanel);
grid.querySelectorAll(".go").forEach(b => b.click());  // 열자마자 자동 로그인
</script>
